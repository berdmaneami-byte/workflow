<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>WorkFlow</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{background:#f4f6fb;color:#0f172a;font-family:Inter,system-ui,sans-serif}.fi{animation:fi .3s ease}@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}input,select,textarea{border:1px solid #e2e8f0;border-radius:10px;padding:8px 12px;width:100%;background:#fff}input:focus,select:focus,textarea:focus{outline:2px solid #6366f1;border-color:transparent}.b{background:#4f46e5;color:#fff;border-radius:10px;padding:8px 16px;font-weight:600;transition:.2s}.b:hover{background:#4338ca}.g{border:1px solid #e2e8f0;border-radius:10px;padding:8px 14px;background:#fff;font-weight:500}.g:hover{background:#f1f5f9}.c{background:#fff;border:1px solid #e8ecf4;border-radius:18px;box-shadow:0 1px 3px rgba(30,41,90,.06)}</style></head>
<body><div id="app"></div>
<script>
const OWNER='berdmaneami@gmail.com',gen=()=>String(100000+Math.floor(Math.random()*9e5)),K='wf2',e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sh=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const TD=sh(new Date().toISOString().slice(0,10),0);
const fmt=d=>d?new Date(d+'T00:00:00Z').toLocaleDateString('fr-FR',{day:'numeric',month:'short',timeZone:'UTC'}):'—';
const COL=['#4f46e5','#0ea5e9','#10b981','#f59e0b','#ec4899','#8b5cf6'];
const L={todo:'À faire',doing:'En cours',done:'Terminée'},P={high:['Haute','bg-red-50 text-red-600'],med:['Moyenne','bg-amber-50 text-amber-600'],low:['Basse','bg-blue-50 text-blue-600']};
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(x){}
if(!S)S={me:null,users:[],tasks:[],log:[],nid:1};S.bugs=S.bugs||[];S.errs=S.errs||[];
if(0){const u=(id,name,email,role,job,i)=>({id,name,email,role,job,pw:role=='admin'?'admin123':'workflow',c:COL[i]});
S={me:null,users:[u(1,'Alex Johnson','admin@workflow.fr','admin','Chef de projet',0),u(2,'Sarah Miller','sarah@workflow.fr','employe','Designer',1),u(3,'Mike Chen','mike@workflow.fr','employe','Développeur',2),u(4,'Emma Davis','emma@workflow.fr','employe','Marketing',3)],
tasks:[[ 'Maquette page d’accueil','high',1,2,'doing'],['Intégration API','med',2,3,'todo'],['Réunion client','high',0,1,'todo','event'],['Guide de style','low',-1,2,'done'],['Campagne newsletter','med',-2,4,'todo'],['Revue du prototype','high',0,2,'doing'],['Facture client','low',5,1,'todo'],['Tests mobiles','med',3,3,'todo']].map((a,i)=>({id:i+1,title:a[0],desc:'',prio:a[1],due:sh(TD,a[2]),as:a[3],status:a[4],type:a[5]||'task',done:a[4]=='done'?sh(TD,-1):null})),log:[{t:Date.now()-36e5,x:'Sarah a terminé « Guide de style »'}],nid:20}}
let ui={v:'dash',auth:'login',cm:'month',cd:TD,m:null,f:0,err:''};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(x){}};
const me=()=>S.users.find(u=>u.id==S.me),U=id=>S.users.find(u=>u.id==id),adm=()=>me()&&['owner','manager','qa'].includes(me().role),mgr=()=>me()&&['owner','manager'].includes(me().role),own=()=>me()&&me().role=='owner',RL={owner:'Propriétaire',manager:'Manager',employe:'Employé',qa:'Testeur (QA)'};
const late=t=>t.status!='done'&&t.due<TD,log=x=>{S.log.unshift({t:Date.now(),x});S.log=S.log.slice(0,20)};
const av=(u,s=8)=>`<span class="inline-flex items-center justify-center rounded-full text-white text-xs font-semibold shrink-0" style="width:${s*4}px;height:${s*4}px;background:${u?u.c:'#94a3b8'}">${u?u.name.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase():'?'}</span>`;
const pr=p=>`<span class="text-xs px-2 py-0.5 rounded-md ${P[p][1]}">${P[p][0]}</span>`;
const NAV=[['dash','Tableau de bord','M3 12l9-9 9 9M5 10v10h14V10'],['tasks','Mes tâches','M9 11l3 3 8-8M4 4h10v2H4z'],['team','Équipe','M17 20v-2a4 4 0 00-4-4H7a4 4 0 00-4 4v2M10 10a4 4 0 100-8 4 4 0 000 8'],['cal','Calendrier','M4 6h16v14H4zM4 10h16M8 3v4M16 3v4'],['rep','Rapports','M5 20V10M12 20V4M19 20v-7'],['set','Paramètres','M12 15a3 3 0 100-6 3 3 0 000 6M19 12h2M3 12h2M12 3v2M12 19v2'],['bug','Debug / QA','M9 7h6a4 4 0 014 4v3a7 7 0 01-14 0v-3a4 4 0 014-4M12 21V11M3 13h4M17 13h4M8 3l2 2M16 3l-2 2']];
const NAVF=()=>NAV.filter(n=>n[0]!='bug'||['qa','owner'].includes(me().role));
const ic=d=>`<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="${d}"/></svg>`;
const scope=()=>adm()?S.tasks:S.tasks.filter(t=>t.as==S.me);
function bars(vals,labels,h=120){const mx=Math.max(1,...vals);return `<div class="flex items-end gap-2" style="height:${h}px">${vals.map((v,i)=>`<div class="flex-1 flex flex-col items-center justify-end h-full gap-1"><span class="text-xs text-slate-500">${v}</span><div class="w-full rounded-t-lg bg-indigo-500 hover:bg-indigo-700 transition-all" style="height:${v/mx*(h-40)+4}px"></div><span class="text-[11px] text-slate-400">${labels[i]}</span></div>`).join('')}</div>`}
const week=()=>{const d=[];for(let i=6;i>=0;i--){const s=sh(TD,-i);d.push([new Date(s+'T00:00:00Z').toLocaleDateString('fr-FR',{weekday:'short',timeZone:'UTC'}),S.tasks.filter(t=>t.done==s).length])}return d};
const stat=(l,v,c,sub)=>`<div class="c p-5 hover:-translate-y-0.5 transition"><p class="text-sm text-slate-500">${l}</p><p class="text-3xl font-bold mt-1 ${c}">${v}</p><p class="text-xs text-slate-400 mt-1">${sub}</p></div>`;
const row=t=>`<div class="flex items-center gap-3 py-2"><input type="checkbox" class="!w-4 !h-4 !p-0" ${t.status=='done'?'checked':''} data-a="tog" data-id="${t.id}"><span class="flex-1 cursor-pointer ${t.status=='done'?'line-through text-slate-400':''}" data-a="edit" data-id="${t.id}">${e(t.title)}</span>${pr(t.prio)}<span class="text-xs ${late(t)?'text-red-500':'text-slate-400'}">${fmt(t.due)}</span></div>`;

function dash(){const a=scope(),all=S.tasks,dn=all.filter(t=>t.status=='done').length,mt=S.tasks.filter(t=>t.as==S.me),pl=all.filter(t=>t.due==TD&&(adm()||t.as==S.me));
return `<div class="fi space-y-6"><div><h1 class="text-2xl font-bold">Bonjour, ${e(me().name.split(' ')[0])} 👋</h1><p class="text-slate-500">Voici l’état de votre équipe aujourd’hui.</p></div>
<div class="grid grid-cols-2 xl:grid-cols-4 gap-4">${stat('Terminées',dn,'text-emerald-600','tâches au total')}${stat('En cours',all.filter(t=>t.status=='doing').length,'text-indigo-600','en ce moment')}${stat('En retard',all.filter(late).length,'text-red-500','à traiter')}${stat('Productivité équipe',(all.length?Math.round(dn/all.length*100):0)+'%','text-slate-900','tâches terminées')}</div>
<div class="grid lg:grid-cols-3 gap-4"><div class="c p-5 lg:col-span-2"><div class="flex justify-between mb-2"><h2 class="font-semibold">Mes tâches</h2><button class="text-indigo-600 text-sm" data-a="new">+ Ajouter</button></div>${mt.length?mt.map(row).join(''):'<p class="text-slate-400 py-4">Aucune tâche assignée.</p>'}</div>
<div class="c p-5"><h2 class="font-semibold mb-2">Planning du jour</h2>${pl.length?pl.map(t=>`<div class="py-2 border-l-4 pl-3 mb-2 bg-indigo-50 rounded-r-lg cursor-pointer" style="border-color:${t.type=='event'?'#f59e0b':'#4f46e5'}" data-a="edit" data-id="${t.id}"><p class="font-medium text-sm">${e(t.title)}</p><p class="text-xs text-slate-500">${t.type=='event'?'Événement':'Échéance'} · ${e(U(t.as)?.name)}</p></div>`).join(''):'<p class="text-slate-400 text-sm">Rien de prévu aujourd’hui.</p>'}</div></div>
<div class="grid lg:grid-cols-3 gap-4"><div class="c p-5 lg:col-span-2"><h2 class="font-semibold mb-3">Productivité hebdomadaire</h2>${bars(week().map(x=>x[1]),week().map(x=>x[0]))}</div>
<div class="c p-5"><h2 class="font-semibold mb-2">Activité récente</h2>${S.log.slice(0,6).map(l=>`<div class="py-1.5 text-sm"><span class="text-slate-400 text-xs mr-2">${new Date(l.t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</span>${e(l.x)}</div>`).join('')||'<p class="text-slate-400 text-sm">Aucune activité.</p>'}</div></div></div>`}

function tasks(){const a=scope().filter(t=>(!ui.f||t.as==ui.f)&&(!ui.q||t.title.toLowerCase().includes(ui.q)));
return `<div class="fi"><div class="flex flex-wrap items-center justify-between gap-2 mb-4"><div><h1 class="text-2xl font-bold">Mes tâches</h1><p class="text-slate-500">Glissez les cartes ou changez le statut.</p></div><div class="flex gap-2"><input data-i="q" placeholder="Rechercher…" value="${e(ui.q||'')}" class="!w-44">${ui.f?`<button class="g" data-a="unf">Filtre : ${e(U(ui.f)?.name)} ✕</button>`:''}<button class="b" data-a="new">+ Ajouter une tâche</button></div></div>
${S.tasks.length?'':'<div class="c p-8 text-center text-slate-500 mb-4">Aucune tâche pour l’instant. Cliquez sur « + Ajouter une tâche » pour commencer.</div>'}<div class="grid md:grid-cols-3 gap-4">${Object.keys(L).map(s=>{const l=a.filter(t=>t.status==s);return `<div class="rounded-2xl p-3 ${s=='todo'?'bg-blue-50':s=='doing'?'bg-indigo-50':'bg-emerald-50'}" data-drop="${s}" ondragover="event.preventDefault()"><h3 class="font-semibold px-1 mb-3">${L[s]} <span class="text-xs bg-white rounded-full px-2 py-0.5">${l.length}</span></h3><div class="space-y-3 min-h-[60px]">${l.map(t=>`<div class="bg-white rounded-xl border p-3 shadow-sm hover:shadow-md transition cursor-pointer" draggable="true" data-drag="${t.id}" data-a="edit" data-id="${t.id}"><div class="flex justify-between gap-2"><p class="font-medium text-sm">${t.type=='event'?'📅 ':''}${e(t.title)}</p>${pr(t.prio)}</div>${t.desc?`<p class="text-xs text-slate-500 mt-1 line-clamp-2">${e(t.desc)}</p>`:''}<div class="flex items-center justify-between mt-3">${av(U(t.as),6)}<span class="text-xs ${late(t)?'text-red-500 font-semibold':'text-slate-400'}">${late(t)?'En retard · ':''}${fmt(t.due)}</span></div></div>`).join('')}</div></div>`}).join('')}</div></div>`}

function team(){return `<div class="fi"><div class="flex justify-between items-center mb-4"><div><h1 class="text-2xl font-bold">Équipe</h1><p class="text-slate-500">${S.users.length} membres</p></div>${mgr()?'<button class="b" data-a="newu">+ Ajouter un employé</button>':''}</div>
<div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4">${S.users.map(u=>{const t=S.tasks.filter(x=>x.as==u.id),d=t.filter(x=>x.status=='done').length,p=t.length?Math.round(d/t.length*100):0;return `<div class="c p-5"><div class="flex items-center gap-3">${av(u,12)}<div class="min-w-0"><p class="font-semibold truncate">${e(u.name)}</p><p class="text-sm text-slate-500 truncate">${e(u.job)} · ${RL[u.role]}</p></div></div><div class="mt-4 flex justify-between text-xs text-slate-500"><span>${t.length} tâches · ${d} terminées</span><span>${p}%</span></div><div class="h-2 bg-slate-100 rounded-full mt-1"><div class="h-2 bg-indigo-500 rounded-full transition-all" style="width:${p}%"></div></div><div class="flex gap-2 mt-4 text-sm"><button class="g flex-1" data-a="utasks" data-id="${u.id}">Tâches</button><button class="g flex-1" data-a="mission" data-id="${u.id}">Mission</button>${mgr()?`<button class="g" data-a="editu" data-id="${u.id}">✎</button>`:''}</div></div>`}).join('')}</div></div>`}

function cal(){const d=new Date(ui.cd+'T00:00:00Z'),it=s=>S.tasks.filter(t=>t.due==s&&(adm()||t.as==S.me)),chip=t=>`<div class="text-xs truncate rounded px-1.5 py-0.5 mb-1 cursor-pointer ${t.type=='event'?'bg-amber-100 text-amber-700':late(t)?'bg-red-100 text-red-600':'bg-indigo-100 text-indigo-700'}" data-a="edit" data-id="${t.id}">${e(t.title)}</div>`;let body='';
if(ui.cm=='month'){const y=d.getUTCFullYear(),m=d.getUTCMonth(),off=(new Date(Date.UTC(y,m,1)).getUTCDay()+6)%7,n=new Date(Date.UTC(y,m+1,0)).getUTCDate(),w=Math.ceil((off+n)/7)*7;body=`<div class="grid grid-cols-7 text-center text-xs text-slate-400 mb-1">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(x=>`<div>${x}</div>`).join('')}</div><div class="grid grid-cols-7 gap-1">${Array.from({length:w},(_,i)=>{const dn=i-off+1;if(dn<1||dn>n)return '<div></div>';const s=new Date(Date.UTC(y,m,dn)).toISOString().slice(0,10);return `<div class="min-h-[84px] border rounded-lg p-1 hover:bg-slate-50 cursor-pointer ${s==TD?'ring-2 ring-indigo-500':''}" data-a="newd" data-d="${s}"><p class="text-xs mb-1 ${s==TD?'text-indigo-600 font-bold':'text-slate-500'}">${dn}</p>${it(s).slice(0,3).map(chip).join('')}</div>`}).join('')}</div>`}
else{const st=ui.cm=='week'?sh(ui.cd,-((d.getUTCDay()+6)%7)):ui.cd,n=ui.cm=='week'?7:1;body=`<div class="grid gap-2 ${n==7?'md:grid-cols-7':''}">${Array.from({length:n},(_,i)=>{const s=sh(st,i);return `<div class="border rounded-xl p-2 min-h-[120px] ${s==TD?'ring-2 ring-indigo-500':''}"><p class="text-xs font-semibold text-slate-500 mb-2 capitalize">${new Date(s+'T00:00:00Z').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'short',timeZone:'UTC'})}</p>${it(s).map(chip).join('')||'<p class="text-xs text-slate-300">Libre</p>'}<button class="text-xs text-indigo-600 mt-1" data-a="newd" data-d="${s}">+ Ajouter</button></div>`}).join('')}</div>`}
return `<div class="fi"><div class="flex flex-wrap justify-between items-center gap-2 mb-4"><h1 class="text-2xl font-bold capitalize">${d.toLocaleDateString('fr-FR',{month:'long',year:'numeric',timeZone:'UTC'})}</h1><div class="flex gap-2 flex-wrap"><button class="g" data-a="cp">←</button><button class="g" data-a="ct">Aujourd’hui</button><button class="g" data-a="cn">→</button>${[['day','Jour'],['week','Semaine'],['month','Mois']].map(x=>`<button class="${ui.cm==x[0]?'b':'g'}" data-a="cm" data-id="${x[0]}">${x[1]}</button>`).join('')}</div></div><div class="c p-4">${body}</div></div>`}

function rep(){const all=S.tasks,dn=all.filter(t=>t.status=='done').length,lt=all.filter(late);
return `<div class="fi space-y-4"><h1 class="text-2xl font-bold">Rapports</h1><div class="grid grid-cols-3 gap-4">${stat('Productivité globale',(all.length?Math.round(dn/all.length*100):0)+'%','text-indigo-600','terminées / total')}${stat('Terminées',dn,'text-emerald-600','tâches')}${stat('Retards',lt.length,'text-red-500','tâches')}</div>
<div class="grid lg:grid-cols-2 gap-4"><div class="c p-5"><h2 class="font-semibold mb-3">Tâches terminées (7 jours)</h2>${bars(week().map(x=>x[1]),week().map(x=>x[0]))}</div>
<div class="c p-5"><h2 class="font-semibold mb-3">Performances individuelles</h2>${S.users.map(u=>{const t=all.filter(x=>x.as==u.id),d=t.filter(x=>x.status=='done').length,p=t.length?Math.round(d/t.length*100):0;return `<div class="flex items-center gap-3 mb-3">${av(u,7)}<span class="w-28 text-sm truncate">${e(u.name)}</span><div class="flex-1 h-2 bg-slate-100 rounded-full"><div class="h-2 rounded-full" style="width:${p}%;background:${u.c}"></div></div><span class="text-sm w-10 text-right">${p}%</span></div>`}).join('')}</div></div>
<div class="c p-5"><h2 class="font-semibold mb-2">Tâches en retard</h2>${lt.map(row).join('')||'<p class="text-slate-400">Aucun retard 🎉</p>'}</div></div>`}

function set(){const u=me();return `<div class="fi max-w-xl space-y-4"><h1 class="text-2xl font-bold">Paramètres &amp; profil</h1><form class="c p-5 space-y-3" data-f="prof"><div class="flex items-center gap-3">${av(u,14)}<span class="text-sm text-slate-500">${RL[u.role]}</span></div>
<label class="block text-sm">Nom<input name="name" required value="${e(u.name)}"></label><label class="block text-sm">Poste<input name="job" value="${e(u.job)}"></label><label class="block text-sm">E-mail<input name="email" type="email" required value="${e(u.email)}"></label><label class="block text-sm">Gmail (agenda)<input name="gm" type="email" value="${e(u.gm||'')}" placeholder="vous@gmail.com"></label><label class="block text-sm">Outlook (agenda)<input name="ol" type="email" value="${e(u.ol||'')}" placeholder="vous@outlook.com"></label><p class="text-xs bg-amber-50 text-amber-700 rounded-lg p-2">📅 Ces adresses sont enregistrées dans votre profil, mais la synchronisation automatique avec Google Agenda / Outlook n’est pas active (nécessite OAuth + Supabase). En attendant, ouvrez une tâche et utilisez « + Google Agenda » ou « + Outlook ».</p><label class="block text-sm">Nouveau mot de passe<input name="pw" type="password" minlength="6" placeholder="Laisser vide pour ne pas changer"></label><button class="b">Enregistrer</button></form>
<button class="g" data-a="out">Se déconnecter</button>${own()?'<button class="g text-red-600 ml-2" data-a="reset">Réinitialiser les données (tout remettre à 0)</button>':''}
<p class="text-xs text-slate-400">ℹ️ Les données sont enregistrées localement dans ce navigateur. Supabase n’est pas connecté dans cette version : l’authentification est simulée (hors production).</p></div>`}

function bug(){const c=[],a=(o,m)=>c.push([o,m]),ids=S.tasks.map(t=>t.id);let ls=1;try{localStorage.setItem('t','1');localStorage.removeItem('t')}catch(x){ls=0}
a(new Set(ids).size==ids.length,'Identifiants de tâches uniques');a(S.tasks.every(t=>U(t.as)),'Chaque tâche a un assigné existant');a(S.tasks.every(t=>/^\d{4}-\d\d-\d\d$/.test(t.due)),'Dates limites valides');a(S.tasks.every(t=>t.title&&L[t.status]&&P[t.prio]),'Titres, statuts et priorités valides');a(S.tasks.every(t=>(t.status=='done')==!!t.done),'Statut Terminée cohérent avec la date de fin');a(new Set(S.users.map(u=>u.email)).size==S.users.length,'E-mails uniques');a(S.users.some(u=>u.role=='owner'),'Un propriétaire existe');a(ls,'Stockage local disponible');a(!S.errs.length,'Aucune erreur JavaScript capturée');
const ST={open:['Ouvert','bg-red-50 text-red-600'],doing:['En cours','bg-amber-50 text-amber-600'],fixed:['Corrigé','bg-emerald-50 text-emerald-600']},SV={low:'Mineure',med:'Majeure',high:'Critique'};
return `<div class="fi space-y-4"><div class="flex justify-between items-center"><div><h1 class="text-2xl font-bold">Debug / QA</h1><p class="text-slate-500">Contrôles automatiques, erreurs et signalements de bugs.</p></div><button class="g" data-a="copy">Copier le rapport</button></div>
<div class="grid lg:grid-cols-2 gap-4"><div class="c p-5"><h2 class="font-semibold mb-3">Tests automatiques (${c.filter(x=>x[0]).length}/${c.length})</h2>${c.map(x=>`<p class="text-sm py-1">${x[0]?'✅':'❌'} ${x[1]}</p>`).join('')}<div class="flex justify-between mt-4 mb-1"><h3 class="font-semibold text-sm">Erreurs JavaScript</h3><button class="text-xs text-indigo-600" data-a="eclr">Vider</button></div>${S.errs.map(x=>`<p class="text-xs text-red-600 py-0.5">${new Date(x.t).toLocaleTimeString('fr-FR')} — ${e(x.x)}</p>`).join('')||'<p class="text-xs text-slate-400">Aucune.</p>'}</div>
<form class="c p-5 space-y-3" data-f="bug"><h2 class="font-semibold">Signaler un bug</h2><input name="title" required placeholder="Titre du bug"><div class="grid grid-cols-2 gap-3"><select name="page">${NAV.map(n=>`<option>${n[1]}</option>`).join('')}</select><select name="sev">${Object.keys(SV).map(k=>`<option value="${k}">${SV[k]}</option>`).join('')}</select></div><textarea name="steps" rows="3" placeholder="Étapes pour reproduire"></textarea><button class="b">Enregistrer le bug</button></form></div>
<div class="c p-5"><h2 class="font-semibold mb-2">Bugs signalés (${S.bugs.length})</h2>${S.bugs.map(b=>`<div class="flex items-start gap-3 py-2 border-b last:border-0"><div class="flex-1 min-w-0"><p class="font-medium text-sm">${e(b.title)}</p><p class="text-xs text-slate-500">${e(b.page)} · ${SV[b.sev]} · ${e(b.by)}${b.steps?' · '+e(b.steps):''}</p></div><button class="text-xs px-2 py-1 rounded-md ${ST[b.st][1]}" data-a="bst" data-id="${b.id}">${ST[b.st][0]}</button><button class="text-slate-400 hover:text-red-500" data-a="bdel" data-id="${b.id}">✕</button></div>`).join('')||'<p class="text-slate-400 text-sm">Aucun bug signalé.</p>'}</div></div>`}
const cl=t=>{const c=encodeURIComponent,d=t.due.replace(/-/g,''),n=sh(t.due,1).replace(/-/g,'');return `<div class="flex gap-4 text-sm"><a class="text-indigo-600 underline" target="_blank" rel="noopener" href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=${c(t.title)}&amp;details=${c(t.desc)}&amp;dates=${d}/${n}">+ Google Agenda</a><a class="text-indigo-600 underline" target="_blank" rel="noopener" href="https://outlook.live.com/calendar/0/deeplink/compose?path=/calendar/action/compose&amp;rru=addevent&amp;subject=${c(t.title)}&amp;body=${c(t.desc)}&amp;startdt=${t.due}&amp;enddt=${t.due}&amp;allday=true">+ Outlook</a></div>`};
function modal(){const m=ui.m;if(!m)return '';let f='';
if(m.k=='task'){const t=m.t;f=`<form data-f="task" class="space-y-3"><h2 class="font-bold text-lg">${t.id?'Modifier':'Nouvelle'} tâche</h2><input name="title" required placeholder="Titre" value="${e(t.title)}"><textarea name="desc" rows="3" placeholder="Description">${e(t.desc)}</textarea><div class="grid grid-cols-2 gap-3"><select name="prio">${Object.keys(P).map(p=>`<option value="${p}" ${t.prio==p?'selected':''}>${P[p][0]}</option>`).join('')}</select><select name="status">${Object.keys(L).map(p=>`<option value="${p}" ${t.status==p?'selected':''}>${L[p]}</option>`).join('')}</select><input type="date" name="due" required value="${t.due}"><select name="type"><option value="task">Tâche</option><option value="event" ${t.type=='event'?'selected':''}>Événement</option></select></div><select name="as">${S.users.map(u=>`<option value="${u.id}" ${t.as==u.id?'selected':''}>${e(u.name)}</option>`).join('')}</select>${t.id?cl(t):''}<div class="flex gap-2 justify-end">${t.id?'<button type="button" class="g text-red-600 mr-auto" data-a="del">Supprimer</button>':''}<button type="button" class="g" data-a="x">Annuler</button><button class="b">Enregistrer</button></div></form>`}
else{const u=m.u;f=`<form data-f="user" class="space-y-3"><h2 class="font-bold text-lg">${u.id?'Modifier':'Ajouter'} un employé</h2><input name="name" required placeholder="Nom complet" value="${e(u.name)}"><input name="job" placeholder="Poste" value="${e(u.job)}"><input name="email" type="email" required placeholder="E-mail" value="${e(u.email)}">${own()?`<select name="role">${Object.keys(RL).map(r=>`<option value="${r}" ${(u.role||'employe')==r?'selected':''}>${RL[r]}</option>`).join('')}</select>`:`<input type="hidden" name="role" value="${u.role||'employe'}">`}${u.id?'':'<p class="text-xs text-slate-400">Mot de passe initial : workflow</p>'}<div class="flex gap-2 justify-end">${u.id&&u.id!=S.me&&own()?'<button type="button" class="g text-red-600 mr-auto" data-a="delu">Supprimer</button>':''}<button type="button" class="g" data-a="x">Annuler</button><button class="b">Enregistrer</button></div></form>`}
return `<div class="fixed inset-0 bg-slate-900/40 flex items-center justify-center p-4 z-50 fi"><div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl max-h-full overflow-auto">${f}</div></div>`}

function auth2(){const q=ui.auth=='quick';return `<div class="min-h-screen flex items-center justify-center p-4"><form data-f="${q?'quick':'verify'}" class="c p-8 w-full max-w-sm space-y-3 fi"><h1 class="text-2xl font-bold text-indigo-600">${q?'Connexion '+(ui.prov=='google'?'Google':'Outlook'):'Vérifier votre e-mail'}</h1><p class="bg-amber-50 text-amber-700 text-xs rounded-lg p-2">⚠️ Mode démonstration : ${q?'Google et Microsoft ne sont pas contactés, aucune authentification réelle (OAuth = version Supabase).':'aucun e-mail n’est envoyé, le code est affiché ci-dessous (envoi réel = version Supabase).'}</p>${q?`<input name="name" placeholder="Nom (nouveau compte)"><input name="email" type="email" required placeholder="${ui.prov=='google'?'vous@gmail.com':'vous@outlook.com'}">`:`<p class="text-sm">Code pour <b>${e(U(ui.vu)?.email)}</b> : <b class="text-indigo-600 tracking-widest">${ui.code}</b></p><input name="code" required inputmode="numeric" maxlength="6" placeholder="Code à 6 chiffres">`}${ui.err?`<p class="text-sm text-red-500">${ui.err}</p>`:''}<button class="b w-full">${q?'Continuer':'Vérifier'}</button><button type="button" class="text-sm text-indigo-600" data-a="sw">Retour</button></form></div>`}
function auth(){if(ui.auth=='verify'||ui.auth=='quick')return auth2();const r=ui.auth=='register';return `<div class="min-h-screen flex items-center justify-center p-4"><form data-f="${ui.auth}" class="c p-8 w-full max-w-sm space-y-3 fi"><h1 class="text-2xl font-bold text-indigo-600">WorkFlow</h1><p class="text-slate-500 text-sm">${r?'Créez votre compte':'Connectez-vous à votre espace'}</p>${r?'<input name="name" required placeholder="Nom complet">':''}<input name="email" type="email" required placeholder="E-mail"><input name="pw" type="password" required minlength="6" placeholder="Mot de passe (6+ caractères)">${r?'<p class="text-xs text-slate-500">Le compte berdmaneami@gmail.com devient Propriétaire. Un code de vérification sera demandé.</p>':''}${ui.err?`<p class="text-sm text-red-500">${ui.err}</p>`:''}<button class="b w-full">${r?'S’inscrire':'Se connecter'}</button><div class="grid grid-cols-2 gap-2 pt-1"><button type="button" class="g text-sm" data-a="qa" data-id="google">Google</button><button type="button" class="g text-sm" data-a="qa" data-id="microsoft">Outlook</button></div><button type="button" class="text-sm text-indigo-600" data-a="sw">${r?'Déjà un compte ? Connexion':'Pas de compte ? Inscription'}</button></form></div>`}

function render(){const A=$('#app');if(!S.me||!me()){A.innerHTML=auth();return}const V={dash,tasks,team,cal,rep,set,bug}[ui.v]();
A.innerHTML=`<div class="flex min-h-screen"><aside class="hidden md:flex flex-col w-64 bg-white border-r p-4 sticky top-0 h-screen"><div class="text-2xl font-extrabold text-indigo-600 px-3 py-4">◆ WorkFlow</div><nav class="space-y-1 flex-1">${NAVF().map(n=>`<button data-a="nav" data-id="${n[0]}" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl transition ${ui.v==n[0]?'bg-indigo-600 text-white shadow':'text-slate-600 hover:bg-slate-100'}">${ic(n[2])}${n[1]}</button>`).join('')}</nav><div class="flex items-center gap-3 p-2 border-t pt-4">${av(me(),10)}<div class="min-w-0"><p class="text-sm font-semibold truncate">${e(me().name)}</p><p class="text-xs text-slate-500">${RL[me().role]}</p></div></div></aside>
<main class="flex-1 min-w-0 p-4 md:p-8 pb-24 md:pb-8"><div class="flex justify-end mb-4"><button class="b" data-a="new">+ Ajouter une tâche</button></div>${V}</main></div>
<nav class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t flex justify-around py-2 z-40">${NAVF().map(n=>`<button data-a="nav" data-id="${n[0]}" class="p-2 rounded-lg ${ui.v==n[0]?'text-indigo-600 bg-indigo-50':'text-slate-400'}">${ic(n[2])}</button>`).join('')}</nav>${modal()}`}
const $=s=>document.querySelector(s),nt=(o={})=>({title:'',desc:'',prio:'med',status:'todo',due:TD,as:S.me,type:'task',...o});
const H={nav:i=>{ui.v=i;ui.f=0},new:()=>ui.m={k:'task',t:nt()},newd:(i,el)=>ui.m={k:'task',t:nt({due:el.dataset.d})},edit:i=>ui.m={k:'task',t:S.tasks.find(t=>t.id==i)},x:()=>ui.m=null,
tog:i=>{const t=S.tasks.find(t=>t.id==i);t.status=t.status=='done'?'todo':'done';t.done=t.status=='done'?TD:null;log(`${me().name} a ${t.status=='done'?'terminé':'rouvert'} « ${t.title} »`);save()},
del:()=>{const t=ui.m.t;S.tasks=S.tasks.filter(x=>x.id!=t.id);log(`${me().name} a supprimé « ${t.title} »`);ui.m=null;save()},
unf:()=>ui.f=0,qa:i=>{ui.prov=i;ui.auth='quick';ui.err=''},bst:i=>{const b=S.bugs.find(b=>b.id==i);b.st={open:'doing',doing:'fixed',fixed:'open'}[b.st];save()},bdel:i=>{S.bugs=S.bugs.filter(b=>b.id!=i);save()},eclr:()=>{S.errs=[];save()},copy:()=>{try{navigator.clipboard.writeText(JSON.stringify({bugs:S.bugs,errs:S.errs},null,1))}catch(x){}},utasks:i=>{ui.f=+i;ui.v='tasks'},mission:i=>ui.m={k:'task',t:nt({as:+i})},newu:()=>ui.m={k:'user',u:{name:'',job:'',email:'',role:'employe'}},editu:i=>ui.m={k:'user',u:U(+i)},
delu:()=>{const u=ui.m.u;S.users=S.users.filter(x=>x.id!=u.id);S.tasks.forEach(t=>{if(t.as==u.id)t.as=S.me});ui.m=null;save()},
cm:i=>ui.cm=i,ct:()=>ui.cd=TD,cp:()=>cs(-1),cn:()=>cs(1),sw:()=>{ui.auth=ui.auth=='login'?'register':'login';ui.err=''},out:()=>{S.me=null;save()},reset:()=>{if(confirm('Effacer toutes les données ?')){localStorage.removeItem(K);location.reload()}}};
function cs(n){const d=new Date(ui.cd+'T00:00:00Z');if(ui.cm=='month')d.setUTCMonth(d.getUTCMonth()+n,1);else d.setUTCDate(d.getUTCDate()+n*(ui.cm=='week'?7:1));ui.cd=d.toISOString().slice(0,10)}
document.addEventListener('click',ev=>{if(ev.target.dataset.a=='tog'){ev.stopPropagation()}const el=ev.target.closest('[data-a]');if(!el)return;if(ev.target.closest('input[data-a=tog]')&&el.dataset.a!='tog')return;H[el.dataset.a]?.(el.dataset.id,el);render()});
document.addEventListener('dragstart',ev=>{const c=ev.target.closest?.('[data-drag]');if(c)ev.dataTransfer.setData('t',c.dataset.drag)});
document.addEventListener('drop',ev=>{const z=ev.target.closest('[data-drop]');if(!z)return;ev.preventDefault();const t=S.tasks.find(t=>t.id==ev.dataTransfer.getData('t'));if(t){t.status=z.dataset.drop;t.done=t.status=='done'?TD:null;log(`${me().name} a déplacé « ${t.title} » → ${L[t.status]}`);save();render()}});
document.addEventListener('submit',ev=>{ev.preventDefault();const f=ev.target.dataset.f,d=Object.fromEntries(new FormData(ev.target));
if(f=='login'){const u=S.users.find(u=>u.email==d.email.trim()&&u.pw==d.pw);if(u&&u.ver===false){ui.vu=u.id;ui.code=gen();ui.auth='verify';ui.err=''}else if(u){S.me=u.id;ui.v='dash';ui.err=''}else ui.err='Identifiants incorrects.'}
else if(f=='register'){if(S.users.some(u=>u.email==d.email))ui.err='E-mail déjà utilisé.';else{const id=S.nid++;S.users.push({id,name:d.name,email:d.email,pw:d.pw,role:d.email.trim().toLowerCase()==OWNER?'owner':'employe',ver:false,job:'',c:COL[id%6]});ui.vu=id;ui.code=gen();ui.auth='verify';ui.err=''}}
else if(f=='verify'){if(d.code.trim()==ui.code){const u=U(ui.vu);u.ver=true;S.me=u.id;ui.v='dash';ui.err='';ui.auth='login'}else ui.err='Code incorrect.'}
else if(f=='quick'){const em=d.email.trim().toLowerCase(),ok=ui.prov=='google'?/@(gmail|googlemail)\.com$/.test(em):/@(outlook|hotmail|live|msn)\.[a-z.]+$/.test(em);if(!ok)ui.err='Adresse '+(ui.prov=='google'?'Gmail':'Outlook/Hotmail')+' requise.';else{let u=S.users.find(u=>u.email.toLowerCase()==em);if(u&&(u.role=='owner'||u.ver===false))ui.err='Ce compte se connecte avec son mot de passe.';else{if(!u){const id=S.nid++;u={id,name:d.name||em.split('@')[0],email:em,pw:Math.random().toString(36).slice(2)+'A1',role:'employe',job:'',c:COL[id%6],prov:ui.prov};S.users.push(u)}S.me=u.id;ui.v='dash';ui.err='';ui.auth='login'}}}
else if(f=='task'){const t=ui.m.t;d.as=+d.as;if(t.id){Object.assign(t,d);log(`${me().name} a modifié « ${t.title} »`)}else{S.tasks.push({id:S.nid++,...d,done:null});log(`${me().name} a créé « ${d.title} »`)}const x=t.id?t:S.tasks.at(-1);x.done=x.status=='done'?(x.done||TD):null;ui.m=null}
else if(f=='user'){const u=ui.m.u;if(u.id)Object.assign(u,d);else{const id=S.nid++;S.users.push({id,...d,pw:'workflow',c:COL[id%6]})}ui.m=null}
else if(f=='bug'){S.bugs.unshift({id:S.nid++,...d,st:'open',by:me().name,at:Date.now()})}
else if(f=='prof'){const u=me();Object.assign(u,{name:d.name,job:d.job,email:d.email,gm:d.gm,ol:d.ol});if(d.pw)u.pw=d.pw;log(`${u.name} a mis à jour son profil`)}
save();render()});
document.addEventListener('input',ev=>{if(ev.target.dataset.i=='q'){ui.q=ev.target.value.toLowerCase();render();const n=$('[data-i=q]');n.focus();n.setSelectionRange(n.value.length,n.value.length)}});
window.addEventListener('error',x=>{S.errs.unshift({t:Date.now(),x:x.message+' (ligne '+(x.lineno||'?')+')'});S.errs=S.errs.slice(0,30);save()});
render();
</script></body></html>
